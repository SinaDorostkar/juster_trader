name: Crypto Bot V4.0.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-bot-v4
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  v4:
    name: Run V4.0.1 bot
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Verify V4.0.1 files
        run: |
          test -f trade_v4.0.1.py
          python -m py_compile trade_v4.0.1.py
          mkdir -p models

      - name: Run V4.0.1
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PROMOTE_SCORE: ${{ secrets.PROMOTE_SCORE }}
          YOUR_CHAT_ID: ${{ secrets.YOUR_CHAT_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python trade_v4.0.1.py

      - name: Show checkpoint changes
        if: always()
        run: |
          git status --short
          git diff -- models/*.pth || true

      - name: Commit trained V4 checkpoints
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A models/
          if git diff --cached --quiet; then
            echo "No new V4 checkpoint to commit."
            exit 0
          fi
          git commit -m "chore: update V4.0.1 model checkpoints"
          git push
