name: Crypto Trade Bots

on:
  schedule:
    - cron: '0 * * * *'      # both bots, every hour
    - cron: '0 0 1 1,7 *'    # calibration report, Jan 1 and Jul 1 (~every 6 months)
  workflow_dispatch: {}        # manual "Run workflow" button for all three jobs

jobs:
  v2_2_4-flat-vector-bot:
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install requests pandas numpy torch turso_serverless

      - name: Run v2.2.4
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          YOUR_CHAT_ID: ${{ secrets.YOUR_CHAT_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python trade_v2.2.4.py

  v3_1_4-lstm-bot:
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # no `needs:` — runs independently; nothing is shared through git anymore
    # (both bots read/write Turso directly), so there's no push race to
    # serialize against either.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install requests pandas numpy torch turso_serverless

      - name: Run v3.1.4
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          YOUR_CHAT_ID: ${{ secrets.YOUR_CHAT_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python trade_v3.1.4.py

  calibration-report:
    if: github.event.schedule == '0 0 1 1,7 *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install requests pandas numpy turso_serverless matplotlib

      - name: Run calibration report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          YOUR_CHAT_ID: ${{ secrets.YOUR_CHAT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python calibration_report.py
